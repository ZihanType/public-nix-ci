name: update-snipaste

on:
  schedule:
    # 用户确认北京时间每天 08:43，避开整点调度高峰。
    - cron: "43 0 * * *"
  workflow_dispatch:

concurrency:
  # 发布和索引推送可恢复，不取消已经开始发布的任务。
  group: update-snipaste
  cancel-in-progress: false

jobs:
  update:
    name: 镜像 Snipaste macOS 和 Linux 安装包
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: update-snipaste
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: 检出默认分支
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: 测试 Snipaste 镜像组件
        run: python3 -m unittest discover -s tests -v

      - name: 校验、发布并更新索引
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -u scripts/update-snipaste.py
