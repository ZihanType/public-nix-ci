name: cleanup-action-cache

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-action-cache:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete all action caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete --all --repo ZihanType/public-nix-ci