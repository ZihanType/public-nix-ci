name: build-nix-cache
run-name: >-
  build-nix-cache source-run=${{ github.event.client_payload.source_run_id || 'manual' }}.${{ github.event.client_payload.source_run_attempt || '0' }} sha=${{ github.event.client_payload.commit_sha || github.sha }}

on:
  repository_dispatch:
    types: [build-nix-cache]
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      prewarm:
        description: Temporarily run nix flake update before building
        required: false
        type: boolean
        default: false

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.client_payload.source_run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build-cache:
    name: Build ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runner }}
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Avalon
            runner: macos-26
            flake_namespace: darwinConfigurations
            flake_suffix: .system
          # - name: nixos-world
          #   runner: ubuntu-26.04-arm
          #   flake_namespace: nixosConfigurations
          #   flake_suffix: .config.system.build.toplevel
          - &work_ubuntu
            name: work-ubuntu
            runner: ubuntu-22.04
            flake_namespace: systemConfigs
            flake_suffix: ""
        config:
          - &nix_config
            # A file-local constant shared by every job that installs Nix.
            extra_substituters: >-
              https://zihan-type.cachix.org
              https://cache.numtide.com
              https://nix-community.cachix.org
              https://devenv.cachix.org
              https://cache.soopy.moe
            extra_trusted_public_keys: >-
              zihan-type.cachix.org-1:Et3+mUASnAGou+mo4Ei1jdQDUWI/UnlF1k3xvxnJzIo=
              niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
              nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
              devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
              cache.soopy.moe-1:0RZVsQeR+GOh0VQI9rvnHz55nVXkFardDqfm4+afjPo=
    env:
      HAS_CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ZihanType/nix-configs
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ github.event.client_payload.commit_sha || 'main' }}

      # - uses: wimpysworld/nothing-but-nix@v10

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = ${{ matrix.config.extra_substituters }}
            extra-trusted-public-keys = ${{ matrix.config.extra_trusted_public_keys }}
            keep-derivations = true
            keep-outputs = true

      - name: Temporarily update flake.lock for prewarm builds
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.prewarm) }}
        run: nix flake update

      - name: Restore and save Nix store
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.prewarm) }}
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: ${{ github.workflow }}-${{ matrix.target.name }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: ${{ github.workflow }}-${{ matrix.target.name }}-
          save: true
          gc-max-store-size: 1G
          purge: true
          purge-primary-key: never
          purge-prefixes: ${{ github.workflow }}-${{ matrix.target.name }}-
          purge-created: 0

      - name: Warn when Cachix token is missing
        if: ${{ env.HAS_CACHIX_AUTH_TOKEN != 'true' }}
        run: echo "::warning::CACHIX_AUTH_TOKEN is not set, skipping Cachix configuration"

      - name: Configure Cachix
        if: ${{ env.HAS_CACHIX_AUTH_TOKEN == 'true' }}
        uses: cachix/cachix-action@v17
        with:
          name: zihan-type
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false

      - name: Build ${{ matrix.target.name }}
        run: nix build "path:.#${{ matrix.target.flake_namespace }}.${{ matrix.target.name }}${{ matrix.target.flake_suffix }}"

  test-work-ubuntu:
    name: Test ${{ matrix.target.name }} as work user
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        target:
          - *work_ubuntu
        config:
          - *nix_config

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ZihanType/nix-configs
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ github.event.client_payload.commit_sha || 'main' }}
          persist-credentials: false

      - name: Install Nix with container-test support
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes auto-allocate-uids cgroups
            auto-allocate-uids = true
            extra-substituters = ${{ matrix.config.extra_substituters }}
            extra-trusted-public-keys = ${{ matrix.config.extra_trusted_public_keys }}

      - name: Temporarily update flake.lock for prewarm tests
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.prewarm) }}
        run: nix flake update

      - name: Restore Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: ${{ github.workflow }}-${{ matrix.target.name }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: ${{ github.workflow }}-${{ matrix.target.name }}-
          save: false

      - name: Build ${{ matrix.target.name }} as the existing work user
        run: ./tests/${{ matrix.target.name }}/build-as-user.sh "${GITHUB_WORKSPACE}"

      - name: Test ${{ matrix.target.name }} activation on Ubuntu 22.04
        run: nix build "path:.#checks.x86_64-linux.${{ matrix.target.name }}" --print-build-logs
