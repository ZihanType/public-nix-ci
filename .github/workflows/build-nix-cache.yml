name: build-nix-cache
run-name: >-
  build-nix-cache source-run=${{ github.event.client_payload.source_run_id || 'manual' }}.${{ github.event.client_payload.source_run_attempt || '0' }} sha=${{ github.event.client_payload.commit_sha || github.sha }}

on:
  repository_dispatch:
    types: [build-nix-cache]
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      prewarm:
        description: Temporarily run nix flake update before building
        required: false
        type: boolean
        default: false

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.client_payload.source_run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build-cache:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Avalon
            runner: macos-26
            target: path:.#darwinConfigurations.Avalon.system
          # - name: nixos-world
          #   runner: ubuntu-26.04-arm
          #   target: path:.#nixosConfigurations.nixos-world.config.system.build.toplevel
          - name: work-ubuntu
            runner: ubuntu-22.04
            target: path:.#systemConfigs.work-ubuntu
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      EXTRA_SUBSTITUTERS: >-
        https://zihan-type.cachix.org
        https://cache.numtide.com
        https://nix-community.cachix.org
        https://devenv.cachix.org
        https://cache.soopy.moe
      EXTRA_TRUSTED_PUBLIC_KEYS: >-
        zihan-type.cachix.org-1:Et3+mUASnAGou+mo4Ei1jdQDUWI/UnlF1k3xvxnJzIo=
        niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
        nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
        devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
        cache.soopy.moe-1:0RZVsQeR+GOh0VQI9rvnHz55nVXkFardDqfm4+afjPo=

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ZihanType/nix-configs
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ github.event.client_payload.commit_sha || 'main' }}

      # - uses: wimpysworld/nothing-but-nix@v10

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = ${{ env.EXTRA_SUBSTITUTERS }}
            extra-trusted-public-keys = ${{ env.EXTRA_TRUSTED_PUBLIC_KEYS }}
            keep-derivations = true
            keep-outputs = true

      - name: Temporarily update flake.lock for prewarm builds
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.prewarm) }}
        run: nix flake update

      - name: Restore and save Nix store
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.prewarm) }}
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: ${{ github.workflow }}-${{ matrix.name }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: ${{ github.workflow }}-${{ matrix.name }}-
          save: true
          gc-max-store-size: 1G
          purge: true
          purge-primary-key: never
          purge-prefixes: ${{ github.workflow }}-${{ matrix.name }}-
          purge-created: 0

      - name: Warn when Cachix token is missing
        if: ${{ env.CACHIX_AUTH_TOKEN == '' }}
        run: echo "::warning::CACHIX_AUTH_TOKEN is not set, skipping Cachix configuration"

      - name: Configure Cachix
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        uses: cachix/cachix-action@v17
        with:
          name: zihan-type
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          useDaemon: false

      - name: Build ${{ matrix.name }}
        run: nix build "${{ matrix.target }}"

  test-work-ubuntu:
    name: Test work-ubuntu as work user
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      EXTRA_SUBSTITUTERS: >-
        https://zihan-type.cachix.org
        https://cache.numtide.com
        https://nix-community.cachix.org
        https://devenv.cachix.org
        https://cache.soopy.moe
      EXTRA_TRUSTED_PUBLIC_KEYS: >-
        zihan-type.cachix.org-1:Et3+mUASnAGou+mo4Ei1jdQDUWI/UnlF1k3xvxnJzIo=
        niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
        nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
        devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
        cache.soopy.moe-1:0RZVsQeR+GOh0VQI9rvnHz55nVXkFardDqfm4+afjPo=

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ZihanType/nix-configs
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
          ref: ${{ github.event.client_payload.commit_sha || 'main' }}
          persist-credentials: false

      - name: Install Nix with container-test support
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes auto-allocate-uids cgroups
            auto-allocate-uids = true
            extra-substituters = ${{ env.EXTRA_SUBSTITUTERS }}
            extra-trusted-public-keys = ${{ env.EXTRA_TRUSTED_PUBLIC_KEYS }}

      - name: Temporarily update flake.lock for prewarm tests
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.prewarm) }}
        run: nix flake update

      - name: Restore Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: ${{ github.workflow }}-work-ubuntu-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: ${{ github.workflow }}-work-ubuntu-
          save: false

      - name: Build work-ubuntu as the existing work user
        run: ./tests/work-ubuntu/build-as-user.sh "${GITHUB_WORKSPACE}"

      - name: Test work-ubuntu activation on Ubuntu 22.04
        run: nix build "path:.#checks.x86_64-linux.work-ubuntu" --print-build-logs
